<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MITM // OPERATIONS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="scanlines" aria-hidden="true"></div>

<header>
  <div class="brand">
    <span class="logo" aria-hidden="true">◢◤</span>
    <div class="brand-text">
      <span class="title">MITM<span class="dim">//</span>OPERATIONS</span>
      <span class="sub">passive metadata intelligence</span>
    </div>
  </div>

  <div class="stats" id="stats">
    <div class="chip"><b id="s-devices">0</b><span>devices</span></div>
    <div class="chip"><b id="s-domains">0</b><span>domains</span></div>
    <div class="chip alert"><b id="s-auth">0</b><span>logins</span></div>
    <div class="chip"><b id="s-countries">0</b><span>countries</span></div>
  </div>

  <div class="status">
    <span class="mode off" id="mode-badge">● CONNECTING</span>
    <span class="mode-msg" id="mode-msg"></span>
    <span class="clock" id="clock">00:00:00</span>
  </div>
</header>

<main>
  <section class="globe-panel glass">
    <div class="panel-label">LIVE GEO-INTELLIGENCE
      <span class="legend" id="legend">
        <i class="auth"></i>auth <i class="tracking"></i>tracking
        <i class="media"></i>media <i class="cdn"></i>cdn <i class="other"></i>other
      </span>
    </div>
    <div id="globe"></div>
  </section>

  <aside class="side">
    <section class="devices glass">
      <div class="panel-label">DEVICES <span class="hint" id="dev-hint"></span></div>
      <div id="device-list"></div>
    </section>

    <section class="feed glass">
      <div class="panel-label">LIVE METADATA
        <span class="filter" id="filter-tag" hidden></span>
      </div>
      <div class="table-head">
        <span>Time</span><span>Type</span><span>Cat</span>
        <span class="num">Hits</span><span class="grow">Domain</span><span>Loc</span>
      </div>
      <div id="meta-rows"></div>
    </section>
  </aside>
</main>

<script>
  // globe.gl bundles three.js. Local first (offline-safe), CDN fallback.
  window._loadGlobe = function (done) {
    var s = document.createElement('script');
    s.src = 'static/globe.gl.min.js';
    s.onload = done;
    s.onerror = function () {
      var c = document.createElement('script');
      c.src = 'https://unpkg.com/globe.gl';
      c.onload = done; c.onerror = function () { done(); };
      document.body.appendChild(c);
    };
    document.body.appendChild(s);
  };
</script>
<script src="app.js"></script>
</body>
</html>
